name: two-databases

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: analytics
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DataLab_2026"
    ports:
      - "14330:1433"
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  postgres-data:
  mssql-data: 